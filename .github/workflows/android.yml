name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ] # Tự động chạy khi bạn push code lên nhánh main hoặc master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v7

    - name: Thiết lập Java 25
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'

    - name: Cấp quyền thực thi cho Gradlew
      run: chmod +x gradlew

    - name: Tiến hành Build file APK (Debug)
      run: ./gradlew assembleDebug

    - name: Upload file APK lên GitHub để bạn tải về
      uses: actions/upload-artifact@v5
      with:
        name: fueltrack-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Create GitHub Release and Upload APK
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        files: app/build/outputs/apk/debug/*.apk
        name: Build ${{ github.run_number }}
        body: "Bản build tự động từ commit ${{ github.sha }}."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}