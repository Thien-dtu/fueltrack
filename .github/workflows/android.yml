name: Android CI - Build APK

on:
  push:
    branches: [ "main", "master" ] # Tự động chạy khi bạn push code lên nhánh main hoặc master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Thiết lập Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu' # Hoặc 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Cấp quyền thực thi cho Gradlew
      run: chmod +x gradlew

    - name: Tiến hành Build file APK (Debug)
      run: ./gradlew assembleDebug

    - name: Upload file APK lên GitHub để bạn tải về
      uses: actions/upload-artifact@v4
      with:
        name: fueltrack-debug-apk
        path: app/build/outputs/apk/debug/*.apk
